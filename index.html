<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="麻將戰績">
  <meta name="theme-color" content="#FFF7ED">
  <title>麻將戰績追蹤器</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="storage.js"></script>
  <script src="libs/react.min.js"></script>
  <script src="libs/react-dom.min.js"></script>
  <script src="libs/babel.min.js"></script>
  <script src="libs/tailwind.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    input, textarea { -webkit-user-select: text; user-select: text; }
    @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slide-up 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-in { animation: fadeIn 0.35s ease-out; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ─── Icons ────────────────────────────────────────────────────────────────
    const CalendarIcon = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <rect x="3" y="4" width="18" height="18" rx="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    );
    const PlusIcon = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    );
    const ChevronLeft = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    );
    const ChevronRight = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    );
    const XIcon = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    );
    const UsersIcon = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    );
    const BarChartIcon = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
        <line x1="2" y1="20" x2="22" y2="20"></line>
      </svg>
    );
    const EditIcon = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
    );
    const TrashIcon = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
        <path d="M10 11v6M14 11v6"></path>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
      </svg>
    );

    // ─── App ─────────────────────────────────────────────────────────────────
    const App = () => {
      const [loading, setLoading] = useState(true);
      const [records, setRecords] = useState([]);
      const [players, setPlayers] = useState(['阿明', '小華', '大強', '林小姐']);

      const [currentDate, setCurrentDate] = useState(new Date());
      const [activeTab, setActiveTab] = useState('calendar');

      // Modal & form state
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingRecord, setEditingRecord] = useState(null);
      const [selectedDate, setSelectedDate] = useState(new Date());
      const [amount, setAmount] = useState('');
      const [note, setNote] = useState('');
      const [type, setType] = useState('win');
      const [selectedPlayers, setSelectedPlayers] = useState([]);

      // Day detail sheet
      const [dayDetailDate, setDayDetailDate] = useState(null);
      const [pendingDeleteId, setPendingDeleteId] = useState(null);

      // Players tab
      const [newPlayerName, setNewPlayerName] = useState('');

      const importRef = useRef(null);
      const touchStartX = useRef(null);

      // Onboarding
      const [showOnboarding, setShowOnboarding] = useState(() => !localStorage.getItem('mahjong_onboarded'));
      const [onboardingStep, setOnboardingStep] = useState(0);

      const ONBOARDING_SLIDES = [
        { emoji: '🀄', title: '歡迎使用\n麻將戰績', desc: '記錄每一場的輸贏，清楚掌握自己的戰況與財務狀況。', accent: '#EA580C' },
        { emoji: '📅', title: '點擊日期\n新增紀錄', desc: '在日曆上點任意日期，輸入金額選擇贏錢或輸錢，即可新增一筆戰績。', accent: '#3B82F6' },
        { emoji: '👥', title: '管理你的\n牌友名單', desc: '建立常用牌友清單，每筆紀錄都可以標記這局的對戰成員。', accent: '#8B5CF6' },
        { emoji: '💾', title: '資料安全\n隨時備份', desc: '換手機前到「牌友」頁面匯出備份，新裝置上再匯入，所有紀錄完整保留。', accent: '#10B981' },
      ];

      const finishOnboarding = () => { localStorage.setItem('mahjong_onboarded', '1'); setShowOnboarding(false); };
      const nextOnboardingStep = () => {
        if (onboardingStep < ONBOARDING_SLIDES.length - 1) setOnboardingStep(s => s + 1);
        else finishOnboarding();
      };
      const handleOnboardingTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
      const handleOnboardingTouchEnd = (e) => {
        if (touchStartX.current === null) return;
        const diff = touchStartX.current - e.changedTouches[0].clientX;
        if (diff > 50) nextOnboardingStep();
        else if (diff < -50 && onboardingStep > 0) setOnboardingStep(s => s - 1);
        touchStartX.current = null;
      };

      useEffect(() => {
        (async () => {
          const d = await window.mahjongStore.load();
          setRecords(d.records); setPlayers(d.players);
          setLoading(false);
        })();
      }, []);

      // 存檔：載入完成後才寫，避免用初始空值覆蓋；debounce 備份
      useEffect(() => {
        if (loading) return;
        window.mahjongStore.save({ records, players, onboarded: true });
        const t = setTimeout(() => window.mahjongStore.writeBackup({ records, players }), 1500);
        return () => clearTimeout(t);
      }, [records, players, loading]);

      // ─── Computed values ─────────────────────────────────────────────────
      const totalBalance = useMemo(() =>
        records.reduce((sum, r) => sum + (r.type === 'win' ? r.amount : -r.amount), 0), [records]);

      const monthlyBalance = useMemo(() => {
        const cm = currentDate.getMonth(), cy = currentDate.getFullYear();
        return records
          .filter(r => { const d = new Date(r.date); return d.getMonth() === cm && d.getFullYear() === cy; })
          .reduce((sum, r) => sum + (r.type === 'win' ? r.amount : -r.amount), 0);
      }, [records, currentDate]);

      const isWinningOverall = totalBalance >= 0;

      const statsData = useMemo(() => {
        const totalGames = records.length;
        const wins = records.filter(r => r.type === 'win').length;
        const losses = totalGames - wins;
        const winRate = totalGames > 0 ? Math.round((wins / totalGames) * 100) : 0;
        const totalWon = records.filter(r => r.type === 'win').reduce((s, r) => s + r.amount, 0);
        const totalLost = records.filter(r => r.type === 'loss').reduce((s, r) => s + r.amount, 0);

        // Last 6 months
        const monthlyData = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
          const m = d.getMonth(), y = d.getFullYear();
          const recs = records.filter(r => { const rd = new Date(r.date); return rd.getMonth() === m && rd.getFullYear() === y; });
          const balance = recs.reduce((s, r) => s + (r.type === 'win' ? r.amount : -r.amount), 0);
          monthlyData.push({ month: m + 1, balance, games: recs.length });
        }

        // Player stats
        const playerMap = {};
        records.forEach(r => {
          (r.participants || []).forEach(p => {
            if (!playerMap[p]) playerMap[p] = { games: 0, wins: 0 };
            playerMap[p].games++;
            if (r.type === 'win') playerMap[p].wins++;
          });
        });
        const playerStats = Object.entries(playerMap)
          .map(([name, d]) => ({ name, ...d }))
          .sort((a, b) => b.games - a.games);

        // Current streak
        let streak = 0, streakType = null;
        const sorted = [...records].sort((a, b) => new Date(b.date) - new Date(a.date));
        for (const r of sorted) {
          if (!streakType) { streakType = r.type; streak = 1; }
          else if (r.type === streakType) streak++;
          else break;
        }

        return { totalGames, wins, losses, winRate, totalWon, totalLost, monthlyData, playerStats, streak, streakType };
      }, [records]);

      // ─── Handlers ────────────────────────────────────────────────────────
      const resetForm = () => {
        setAmount(''); setNote(''); setSelectedPlayers([]); setType('win'); setEditingRecord(null);
      };

      const openAddModal = (date) => {
        setSelectedDate(date);
        setIsAddModalOpen(true);
      };

      const handleDateClick = (dateObj) => {
        const dateStr = dateObj.toDateString();
        const dayRecs = records.filter(r => new Date(r.date).toDateString() === dateStr);
        if (dayRecs.length > 0) {
          setPendingDeleteId(null);
          setDayDetailDate(dateObj);
        } else {
          openAddModal(dateObj);
        }
      };

      const handleEditRecord = (rec) => {
        setEditingRecord(rec);
        setSelectedDate(new Date(rec.date));
        setAmount(String(rec.amount));
        setType(rec.type);
        setNote(rec.note || '');
        setSelectedPlayers(rec.participants || []);
        setDayDetailDate(null);
        setIsAddModalOpen(true);
      };

      const handleSaveRecord = () => {
        const parsed = parseInt(amount);
        if (!amount || isNaN(parsed) || parsed <= 0) return;
        if (editingRecord) {
          setRecords(prev => prev.map(r => r.id === editingRecord.id
            ? { ...r, amount: parsed, type, note, participants: selectedPlayers }
            : r
          ));
        } else {
          setRecords(prev => [...prev, {
            id: Date.now(), date: selectedDate.toISOString(),
            amount: parsed, type, note, participants: selectedPlayers
          }]);
        }
        resetForm();
        setIsAddModalOpen(false);
      };

      const handleDeleteRecord = (id) => {
        // Close day detail if this was the last record for that day
        if (dayDetailDate) {
          const remaining = records.filter(r => r.id !== id && new Date(r.date).toDateString() === dayDetailDate.toDateString());
          if (remaining.length === 0) setDayDetailDate(null);
        }
        setRecords(prev => prev.filter(r => r.id !== id));
        setPendingDeleteId(null);
        if (isAddModalOpen) { setIsAddModalOpen(false); resetForm(); }
      };

      // Two-tap delete pattern: first tap arms, second tap fires
      const handleTwoTapDelete = (id, e) => {
        e && e.stopPropagation();
        if (pendingDeleteId === id) {
          handleDeleteRecord(id);
        } else {
          setPendingDeleteId(id);
          setTimeout(() => setPendingDeleteId(prev => prev === id ? null : prev), 3000);
        }
      };

      const togglePlayerSelection = (name) =>
        setSelectedPlayers(prev => prev.includes(name) ? prev.filter(p => p !== name) : [...prev, name]);

      const addNewPlayer = () => {
        const name = newPlayerName.trim();
        if (name && !players.includes(name)) { setPlayers(prev => [...prev, name]); setNewPlayerName(''); }
      };

      const exportData = () => {
        const now = new Date();
        const fn = `麻將戰績_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}.json`;
        const blob = new Blob([JSON.stringify({ records, players }, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = fn; a.click();
        URL.revokeObjectURL(url);
      };

      const importData = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (window.confirm(`匯入 ${(parsed.records||[]).length} 筆紀錄？現有資料將被覆蓋。`)) {
              setRecords(parsed.records || []);
              setPlayers(parsed.players || []);
            }
          } catch { alert('檔案格式錯誤，請選擇正確的備份檔案。'); }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      // ─── Calendar helpers ─────────────────────────────────────────────────
      const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
      const firstDayOfMonth = (y, m) => new Date(y, m, 1).getDay();

      const renderCalendar = () => {
        const days = [];
        const year = currentDate.getFullYear(), month = currentDate.getMonth();
        const totalDays = daysInMonth(year, month), firstDay = firstDayOfMonth(year, month);
        for (let i = 0; i < firstDay; i++) days.push(<div key={`e-${i}`} className="h-14" />);
        for (let d = 1; d <= totalDays; d++) {
          const dateObj = new Date(year, month, d);
          const dayRecs = records.filter(r => new Date(r.date).toDateString() === dateObj.toDateString());
          const isToday = new Date().toDateString() === dateObj.toDateString();
          const hasWin = dayRecs.some(r => r.type === 'win');
          const hasLoss = dayRecs.some(r => r.type === 'loss');
          days.push(
            <div key={d} onClick={() => handleDateClick(dateObj)}
              className={`h-14 border-t border-black/5 flex flex-col items-center justify-start pt-1 cursor-pointer active:bg-gray-100 transition-all ${isToday ? 'bg-blue-50/50' : ''}`}>
              <span className={`text-xs ${isToday ? 'text-blue-600 font-black underline decoration-2' : 'text-gray-600'}`}>{d}</span>
              {dayRecs.length > 0 && (
                <div className="flex flex-col items-center mt-0.5 gap-0.5">
                  <div className="flex gap-0.5">
                    {hasWin && <div className="w-1.5 h-1.5 rounded-full bg-red-500" />}
                    {hasLoss && <div className="w-1.5 h-1.5 rounded-full bg-emerald-500" />}
                  </div>
                  {dayRecs.length > 1 && <span className="text-[8px] font-black text-gray-400">{dayRecs.length}</span>}
                </div>
              )}
            </div>
          );
        }
        return days;
      };

      const isCurrentYear = currentDate.getFullYear() === new Date().getFullYear();
      const calendarTitle = isCurrentYear
        ? `${currentDate.getMonth() + 1}月`
        : `${currentDate.getFullYear()} / ${currentDate.getMonth() + 1}`;

      const dayDetailRecords = dayDetailDate
        ? records.filter(r => new Date(r.date).toDateString() === dayDetailDate.toDateString())
        : [];

      const maxAbsBalance = Math.max(...statsData.monthlyData.map(m => Math.abs(m.balance)), 1);

      if (loading) return (<div className="flex items-center justify-center h-screen text-gray-400">載入中…</div>);

      // ─── Render ──────────────────────────────────────────────────────────
      return (
        <div className={`min-h-screen transition-colors duration-700 pb-28 ${isWinningOverall ? 'bg-orange-50/50' : 'bg-slate-100'}`}>

          {/* Header */}
          <header className={`sticky top-0 z-20 px-6 pt-16 pb-5 border-b transition-all duration-500 ${isWinningOverall ? 'bg-white/80 border-orange-100 backdrop-blur-md' : 'bg-slate-200/80 border-slate-300 backdrop-blur-md'}`}>
            <div className="flex justify-between items-end">
              <div>
                <h1 className="text-2xl font-black text-gray-800 flex items-center gap-2">
                  麻將戰績 {isWinningOverall ? '🧧' : '🧘'}
                </h1>
                <p className={`text-[10px] font-bold mt-0.5 uppercase tracking-[0.2em] ${isWinningOverall ? 'text-orange-500' : 'text-slate-500'}`}>
                  {isWinningOverall ? '紅不讓・氣勢正旺' : '閉關中・韜光養晦'}
                </p>
              </div>
              <div className="text-right">
                <span className="text-[10px] text-gray-400 font-bold block">總結算</span>
                <span className={`text-xl font-black ${isWinningOverall ? 'text-red-500' : 'text-emerald-700'}`}>
                  {totalBalance >= 0 ? '+' : ''}{totalBalance.toLocaleString()}
                </span>
              </div>
            </div>
          </header>

          <main className="max-w-md mx-auto p-4 space-y-5">

            {/* ── Calendar Tab ──────────────────────────────────────── */}
            {activeTab === 'calendar' && (
              <div className="animate-in space-y-5">
                {/* Month nav */}
                <div className={`p-4 rounded-3xl shadow-sm border flex justify-between items-center bg-white ${isWinningOverall ? 'border-orange-100' : 'border-slate-200'}`}>
                  <div className="flex items-center gap-3">
                    <div className={`p-2 rounded-2xl ${monthlyBalance >= 0 ? 'bg-red-50 text-red-500' : 'bg-emerald-50 text-emerald-600'}`}>
                      <div className="w-5 h-5"><CalendarIcon /></div>
                    </div>
                    <div>
                      <div className="text-[10px] text-gray-400 font-bold">本月合計</div>
                      <div className="font-black text-base">{monthlyBalance >= 0 ? '+' : ''}{monthlyBalance.toLocaleString()}</div>
                    </div>
                  </div>
                  <div className="flex gap-1 items-center bg-gray-50 rounded-2xl p-1">
                    <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1))} className="p-1.5 active:bg-white rounded-xl transition-all">
                      <div className="w-4 h-4 text-gray-400"><ChevronLeft /></div>
                    </button>
                    <div className="px-1 font-black text-xs text-gray-600 w-20 text-center">{calendarTitle}</div>
                    <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1))} className="p-1.5 active:bg-white rounded-xl transition-all">
                      <div className="w-4 h-4 text-gray-400"><ChevronRight /></div>
                    </button>
                  </div>
                </div>

                {/* Calendar grid */}
                <div className="bg-white rounded-[32px] shadow-sm overflow-hidden border border-gray-100">
                  <div className="grid grid-cols-7 text-center py-3 bg-gray-50/50">
                    {['日','一','二','三','四','五','六'].map(d => (
                      <span key={d} className="text-[10px] font-black text-gray-300">{d}</span>
                    ))}
                  </div>
                  <div className="grid grid-cols-7">{renderCalendar()}</div>
                </div>

                {/* Recent records list */}
                <div className="space-y-2.5">
                  <div className="flex justify-between items-center px-2">
                    <h3 className="font-black text-sm text-gray-800">最近紀錄</h3>
                    <span className="text-[10px] text-gray-400 font-bold">共 {records.length} 筆</span>
                  </div>
                  {records.length === 0 ? (
                    <div className="bg-white/40 rounded-3xl py-12 text-center border border-dashed border-gray-200">
                      <p className="text-4xl mb-2">🀄</p>
                      <p className="text-xs text-gray-400">點擊日期新增第一筆戰績</p>
                    </div>
                  ) : (
                    <div style={{ maxHeight: '420px', overflowY: 'auto' }} className="space-y-2.5">
                      {records.slice().reverse().map(rec => (
                        <div key={rec.id} onClick={() => handleEditRecord(rec)}
                          className="bg-white p-4 rounded-[24px] shadow-sm border border-gray-50 flex justify-between items-center active:bg-gray-50 transition-colors cursor-pointer">
                          <div className="flex items-center gap-3">
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-black text-xs ${rec.type === 'win' ? 'bg-red-50 text-red-500' : 'bg-emerald-50 text-emerald-600'}`}>
                              {rec.type === 'win' ? '勝' : '敗'}
                            </div>
                            <div>
                              <div className="text-xs font-black text-gray-800">
                                {new Date(rec.date).toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' })}
                                {rec.note && <span className="ml-2 text-[10px] font-normal text-gray-400">{rec.note}</span>}
                              </div>
                              <div className="flex flex-wrap gap-1 mt-1">
                                {rec.participants?.map(p => (
                                  <span key={p} className="text-[8px] bg-gray-100 px-1.5 py-0.5 rounded text-gray-500">{p}</span>
                                ))}
                              </div>
                            </div>
                          </div>
                          <div className="flex items-center gap-2">
                            <div className={`font-black text-base ${rec.type === 'win' ? 'text-red-500' : 'text-emerald-700'}`}>
                              {rec.type === 'win' ? '+' : '-'}{rec.amount.toLocaleString()}
                            </div>
                            <div className="w-4 h-4 text-gray-300 shrink-0"><EditIcon /></div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ── Stats Tab ─────────────────────────────────────────── */}
            {activeTab === 'stats' && (
              <div className="animate-in space-y-5">
                {records.length === 0 ? (
                  <div className="bg-white/40 rounded-3xl py-16 text-center border border-dashed border-gray-200">
                    <p className="text-4xl mb-3">📊</p>
                    <p className="text-sm text-gray-400 font-bold">還沒有戰績資料</p>
                    <p className="text-xs text-gray-300 mt-1">新增幾筆紀錄後就能看到統計了</p>
                  </div>
                ) : (<>
                  {/* Summary 2×2 grid */}
                  <div className="grid grid-cols-2 gap-3">
                    {[
                      { label: '總場次', value: statsData.totalGames, unit: '場', color: 'text-gray-800', bg: 'bg-white' },
                      { label: '勝率', value: statsData.winRate, unit: '%', color: statsData.winRate >= 50 ? 'text-red-500' : 'text-emerald-600', bg: statsData.winRate >= 50 ? 'bg-red-50' : 'bg-emerald-50' },
                      { label: '勝場', value: statsData.wins, unit: '場', color: 'text-red-500', bg: 'bg-red-50' },
                      { label: '敗場', value: statsData.losses, unit: '場', color: 'text-emerald-600', bg: 'bg-emerald-50' },
                    ].map(c => (
                      <div key={c.label} className={`${c.bg} rounded-[24px] p-5 border border-gray-100 shadow-sm`}>
                        <div className="text-[10px] text-gray-400 font-bold mb-1">{c.label}</div>
                        <div className={`text-2xl font-black ${c.color}`}>
                          {c.value}<span className="text-sm font-bold ml-0.5">{c.unit}</span>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Streak banner */}
                  {statsData.streak >= 2 && (
                    <div className={`p-4 rounded-[24px] flex items-center gap-3 ${statsData.streakType === 'win' ? 'bg-red-50 border border-red-100' : 'bg-slate-100 border border-slate-200'}`}>
                      <span className="text-2xl">{statsData.streakType === 'win' ? '🔥' : '🌊'}</span>
                      <div>
                        <div className="font-black text-sm text-gray-800">
                          {statsData.streakType === 'win' ? `連勝 ${statsData.streak} 場！` : `連敗 ${statsData.streak} 場`}
                        </div>
                        <div className="text-[10px] text-gray-400 mt-0.5">
                          {statsData.streakType === 'win' ? '氣勢如虹，繼續保持！' : '調整心態，下場加油'}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Monthly bar chart */}
                  <div className="bg-white rounded-[32px] p-5 shadow-sm border border-gray-100">
                    <h3 className="font-black text-sm text-gray-800 mb-5">近 6 個月趨勢</h3>
                    <div className="flex items-end justify-between gap-2" style={{ height: '110px' }}>
                      {statsData.monthlyData.map((m, i) => {
                        const pct = Math.abs(m.balance) / maxAbsBalance;
                        const barH = Math.max(pct * 72, m.games > 0 ? 5 : 0);
                        const isPos = m.balance >= 0;
                        const fmt = v => Math.abs(v) >= 1000
                          ? (v > 0 ? '+' : '') + Math.round(v / 1000) + 'k'
                          : (v > 0 ? '+' : '') + v;
                        return (
                          <div key={i} className="flex-1 flex flex-col items-center justify-end gap-1" style={{ height: '100px' }}>
                            {m.games > 0 && (
                              <span className="text-[8px] font-black" style={{ color: isPos ? '#ef4444' : '#059669' }}>
                                {fmt(m.balance)}
                              </span>
                            )}
                            <div
                              className={`w-full rounded-t-md ${m.games === 0 ? 'bg-gray-100' : isPos ? 'bg-red-400' : 'bg-emerald-400'}`}
                              style={{ height: `${barH}px`, minHeight: m.games > 0 ? '4px' : '0' }}
                            />
                            <span className="text-[9px] text-gray-400 font-bold">{m.month}月</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* P&L summary */}
                  <div className="bg-white rounded-[32px] p-5 shadow-sm border border-gray-100">
                    <h3 className="font-black text-sm text-gray-800 mb-4">收支概覽</h3>
                    <div className="space-y-3">
                      <div className="flex justify-between items-center">
                        <span className="text-xs text-gray-500">累計贏得</span>
                        <span className="font-black text-red-500">+{statsData.totalWon.toLocaleString()}</span>
                      </div>
                      <div className="flex justify-between items-center">
                        <span className="text-xs text-gray-500">累計輸掉</span>
                        <span className="font-black text-emerald-600">-{statsData.totalLost.toLocaleString()}</span>
                      </div>
                      <div className="border-t border-gray-100 pt-3 flex justify-between items-center">
                        <span className="text-xs font-black text-gray-700">淨損益</span>
                        <span className={`font-black text-base ${totalBalance >= 0 ? 'text-red-500' : 'text-emerald-600'}`}>
                          {totalBalance >= 0 ? '+' : ''}{totalBalance.toLocaleString()}
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* Player stats */}
                  {statsData.playerStats.length > 0 && (
                    <div className="bg-white rounded-[32px] p-5 shadow-sm border border-gray-100">
                      <h3 className="font-black text-sm text-gray-800 mb-4">牌友同場統計</h3>
                      <div className="space-y-3">
                        {statsData.playerStats.map(p => (
                          <div key={p.name} className="flex items-center gap-3">
                            <div className="w-8 h-8 rounded-xl bg-gray-100 flex items-center justify-center text-xs font-black text-gray-600 shrink-0">
                              {p.name[0]}
                            </div>
                            <div className="flex-1">
                              <div className="flex justify-between items-center mb-1.5">
                                <span className="text-xs font-black text-gray-700">{p.name}</span>
                                <span className="text-[10px] text-gray-400">
                                  {p.games} 場・{Math.round(p.wins / p.games * 100)}% 勝
                                </span>
                              </div>
                              <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                <div className="h-full bg-blue-400 rounded-full"
                                  style={{ width: `${(p.games / statsData.totalGames) * 100}%` }} />
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </>)}
              </div>
            )}

            {/* ── Players Tab ───────────────────────────────────────── */}
            {activeTab === 'players' && (
              <div className="animate-in space-y-5">
                <div className="bg-white p-6 rounded-[32px] shadow-sm border border-gray-100">
                  <h3 className="font-black text-xl flex items-center gap-2 mb-5">
                    <div className="w-5 h-5 text-blue-500"><UsersIcon /></div> 牌友名單
                  </h3>
                  <div className="flex gap-2 mb-6 bg-gray-50 p-2 rounded-2xl border border-gray-100">
                    <input type="text" value={newPlayerName}
                      onChange={e => setNewPlayerName(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && addNewPlayer()}
                      placeholder="輸入新牌友名稱..." className="flex-1 bg-transparent border-0 px-3 py-2 text-sm focus:ring-0" />
                    <button onClick={addNewPlayer} className="bg-blue-600 text-white p-2 rounded-xl active:scale-90 transition-all">
                      <div className="w-5 h-5"><PlusIcon /></div>
                    </button>
                  </div>
                  <div className="grid grid-cols-2 gap-2.5">
                    {players.map(p => (
                      <div key={p} className="bg-gray-50 p-3 rounded-xl flex justify-between items-center border border-gray-100">
                        <span className="font-bold text-gray-700 text-sm">{p}</span>
                        <button onClick={() => setPlayers(prev => prev.filter(pl => pl !== p))} className="text-gray-300 p-1">
                          <div className="w-3 h-3"><XIcon /></div>
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-white p-6 rounded-[32px] shadow-sm border border-gray-100">
                  <h3 className="font-black text-xl text-gray-800 mb-1">資料備份</h3>
                  <p className="text-[11px] text-gray-400 mb-5">匯出或匯入戰績備份檔案</p>
                  <div className="space-y-3">
                    <button onClick={exportData} className="w-full py-3.5 rounded-2xl font-black text-sm text-white bg-blue-600 active:scale-95 transition-all">
                      匯出備份
                    </button>
                    <button onClick={() => importRef.current?.click()} className="w-full py-3.5 rounded-2xl font-black text-sm text-gray-600 bg-gray-100 active:scale-95 transition-all">
                      匯入備份
                    </button>
                    <input ref={importRef} type="file" accept=".json" onChange={importData} style={{ display: 'none' }} />
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* ── Bottom Nav (4 items) ─────────────────────────────────── */}
          <nav className={`fixed bottom-0 left-0 right-0 border-t flex items-center pb-8 pt-3 backdrop-blur-2xl ${isWinningOverall ? 'bg-white/90 border-orange-100' : 'bg-slate-50/90 border-slate-300'}`}>
            <button onClick={() => setActiveTab('calendar')} className={`flex-1 flex flex-col items-center gap-1 transition-all ${activeTab === 'calendar' ? 'text-blue-600' : 'text-gray-300'}`}>
              <div className="w-6 h-6"><CalendarIcon /></div>
              <span className="text-[9px] font-black tracking-widest">戰績</span>
            </button>
            <button onClick={() => setActiveTab('stats')} className={`flex-1 flex flex-col items-center gap-1 transition-all ${activeTab === 'stats' ? 'text-blue-600' : 'text-gray-300'}`}>
              <div className="w-6 h-6"><BarChartIcon /></div>
              <span className="text-[9px] font-black tracking-widest">統計</span>
            </button>
            <button
              onClick={() => { resetForm(); setSelectedDate(new Date()); setIsAddModalOpen(true); }}
              className={`-mt-10 mx-5 w-14 h-14 rounded-full flex items-center justify-center text-white shadow-xl active:scale-90 transition-all shrink-0 ${isWinningOverall ? 'bg-red-500' : 'bg-slate-800'}`}>
              <div className="w-7 h-7"><PlusIcon /></div>
            </button>
            <button onClick={() => setActiveTab('players')} className={`flex-1 flex flex-col items-center gap-1 transition-all ${activeTab === 'players' ? 'text-blue-600' : 'text-gray-300'}`}>
              <div className="w-6 h-6"><UsersIcon /></div>
              <span className="text-[9px] font-black tracking-widest">牌友</span>
            </button>
          </nav>

          {/* ── Add / Edit Modal ─────────────────────────────────────── */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white w-full max-w-md rounded-t-[40px] p-8 pb-12 animate-slide-up shadow-2xl overflow-y-auto max-h-[90vh]">
                <div className="flex justify-between items-center mb-6">
                  <div>
                    <h2 className="text-xl font-black text-gray-800">
                      {editingRecord ? '編輯紀錄' : selectedDate.toLocaleDateString('zh-TW', { month: 'long', day: 'numeric' })}
                    </h2>
                    {editingRecord && (
                      <p className="text-xs text-gray-400 mt-0.5">
                        {new Date(editingRecord.date).toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' })}
                      </p>
                    )}
                  </div>
                  <button onClick={() => { setIsAddModalOpen(false); resetForm(); }} className="bg-gray-100 p-2 rounded-full text-gray-400">
                    <div className="w-5 h-5"><XIcon /></div>
                  </button>
                </div>

                <div className="space-y-5">
                  {/* Win / Loss toggle */}
                  <div className="flex p-1 bg-gray-100 rounded-2xl">
                    <button onClick={() => setType('win')} className={`flex-1 py-3 rounded-xl text-xs font-black transition-all ${type === 'win' ? 'bg-white text-red-500 shadow-sm' : 'text-gray-400'}`}>贏錢</button>
                    <button onClick={() => setType('loss')} className={`flex-1 py-3 rounded-xl text-xs font-black transition-all ${type === 'loss' ? 'bg-white text-emerald-600 shadow-sm' : 'text-gray-400'}`}>輸錢</button>
                  </div>

                  {/* Amount input */}
                  <div className="relative">
                    <span className="absolute left-5 top-1/2 -translate-y-1/2 font-black text-xl text-gray-300">$</span>
                    <input type="number" value={amount} onChange={e => setAmount(e.target.value)}
                      placeholder="0" inputMode="numeric"
                      className="w-full bg-gray-50 border-0 p-5 pl-12 rounded-2xl text-3xl font-black text-center focus:ring-2 focus:ring-blue-500" />
                  </div>

                  {/* Player selection */}
                  {players.length > 0 && (
                    <div>
                      <p className="text-[10px] text-gray-400 font-bold mb-2 px-1">本場牌友</p>
                      <div className="flex flex-wrap gap-2">
                        {players.map(p => (
                          <button key={p} onClick={() => togglePlayerSelection(p)}
                            className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all ${selectedPlayers.includes(p) ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-gray-100 text-gray-400'}`}>
                            {p}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Note */}
                  <input type="text" value={note} onChange={e => setNote(e.target.value)}
                    placeholder="戰報備註（選填）" className="w-full bg-gray-50 border-0 p-4 rounded-xl text-sm" />

                  {/* Save */}
                  <button onClick={handleSaveRecord}
                    className={`w-full py-4 rounded-2xl font-black text-lg text-white shadow-lg active:scale-95 transition-all ${type === 'win' ? 'bg-red-500 shadow-red-100' : 'bg-emerald-600 shadow-emerald-100'}`}>
                    {editingRecord ? '更新紀錄' : '儲存紀錄'}
                  </button>

                  {/* Delete (edit mode only) */}
                  {editingRecord && (
                    <button onClick={() => handleDeleteRecord(editingRecord.id)}
                      className="w-full py-3 rounded-2xl font-black text-sm text-red-400 bg-red-50 active:scale-95 transition-all">
                      刪除這筆紀錄
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ── Day Detail Sheet ─────────────────────────────────────── */}
          {dayDetailDate && (
            <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/40 backdrop-blur-sm"
              onClick={() => { setDayDetailDate(null); setPendingDeleteId(null); }}>
              <div className="bg-white w-full max-w-md rounded-t-[40px] p-6 pb-12 animate-slide-up shadow-2xl overflow-y-auto max-h-[80vh]"
                onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-5">
                  <h2 className="text-xl font-black text-gray-800">
                    {dayDetailDate.toLocaleDateString('zh-TW', { month: 'long', day: 'numeric' })}
                    <span className="ml-2 text-sm font-normal text-gray-400">{dayDetailRecords.length} 筆</span>
                  </h2>
                  <button onClick={() => { setDayDetailDate(null); setPendingDeleteId(null); }} className="bg-gray-100 p-2 rounded-full text-gray-400">
                    <div className="w-5 h-5"><XIcon /></div>
                  </button>
                </div>

                <div className="space-y-3 mb-5">
                  {dayDetailRecords.map(rec => (
                    <div key={rec.id} className="bg-gray-50 p-4 rounded-[20px] flex justify-between items-center">
                      <div className="flex items-center gap-3">
                        <div className={`w-9 h-9 rounded-xl flex items-center justify-center font-black text-xs ${rec.type === 'win' ? 'bg-red-50 text-red-500' : 'bg-emerald-50 text-emerald-600'}`}>
                          {rec.type === 'win' ? '勝' : '敗'}
                        </div>
                        <div>
                          <div className={`font-black text-base ${rec.type === 'win' ? 'text-red-500' : 'text-emerald-600'}`}>
                            {rec.type === 'win' ? '+' : '-'}{rec.amount.toLocaleString()}
                          </div>
                          <div className="flex flex-wrap gap-1 mt-0.5">
                            {rec.participants?.map(p => (
                              <span key={p} className="text-[8px] bg-white border border-gray-100 px-1.5 py-0.5 rounded text-gray-500">{p}</span>
                            ))}
                            {rec.note && <span className="text-[8px] text-gray-400">{rec.note}</span>}
                          </div>
                        </div>
                      </div>
                      <div className="flex gap-2 shrink-0">
                        <button onClick={() => handleEditRecord(rec)} className="p-2 bg-blue-50 rounded-xl text-blue-400 active:scale-90 transition-all">
                          <div className="w-4 h-4"><EditIcon /></div>
                        </button>
                        <button onClick={e => handleTwoTapDelete(rec.id, e)}
                          className={`p-2 rounded-xl active:scale-90 transition-all ${pendingDeleteId === rec.id ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-400'}`}>
                          <div className="w-4 h-4"><TrashIcon /></div>
                        </button>
                      </div>
                    </div>
                  ))}
                  {pendingDeleteId && (
                    <p className="text-center text-[10px] text-red-400 font-bold">再點一次確認刪除</p>
                  )}
                </div>

                <button onClick={() => { setDayDetailDate(null); openAddModal(dayDetailDate); }}
                  className="w-full py-3.5 rounded-2xl font-black text-sm text-white bg-blue-600 active:scale-95 transition-all">
                  + 新增這天的紀錄
                </button>
              </div>
            </div>
          )}

          {/* ── Onboarding ───────────────────────────────────────────── */}
          {showOnboarding && (() => {
            const slide = ONBOARDING_SLIDES[onboardingStep];
            const isLast = onboardingStep === ONBOARDING_SLIDES.length - 1;
            return (
              <div className="fixed inset-0 z-[200] flex flex-col items-center justify-between pb-12 pt-20 px-8"
                style={{ background: '#0D0D12' }}
                onTouchStart={handleOnboardingTouchStart} onTouchEnd={handleOnboardingTouchEnd}>
                {!isLast && (
                  <button onClick={finishOnboarding} className="absolute top-14 right-6 text-xs font-bold" style={{ color: '#555' }}>跳過</button>
                )}
                <div className="flex-1 flex flex-col items-center justify-center w-full max-w-sm">
                  <div className="w-28 h-28 rounded-[32px] flex items-center justify-center mb-10 shadow-2xl"
                    style={{ background: slide.accent + '22', border: `2px solid ${slide.accent}33` }}>
                    <span style={{ fontSize: '64px', lineHeight: 1 }}>{slide.emoji}</span>
                  </div>
                  <h2 className="text-3xl font-black text-center mb-4 leading-snug" style={{ color: '#F5F5F5', whiteSpace: 'pre-line' }}>
                    {slide.title}
                  </h2>
                  <p className="text-center text-sm leading-relaxed" style={{ color: '#888', maxWidth: '280px' }}>
                    {slide.desc}
                  </p>
                </div>
                <div className="w-full max-w-sm flex flex-col items-center gap-6">
                  <div className="flex gap-2">
                    {ONBOARDING_SLIDES.map((_, i) => (
                      <div key={i} onClick={() => setOnboardingStep(i)}
                        className="rounded-full transition-all duration-300 cursor-pointer"
                        style={{ width: i === onboardingStep ? '24px' : '8px', height: '8px', background: i === onboardingStep ? slide.accent : '#333' }} />
                    ))}
                  </div>
                  <button onClick={nextOnboardingStep}
                    className="w-full py-4 rounded-2xl font-black text-base text-white active:scale-95 transition-all"
                    style={{ background: slide.accent }}>
                    {isLast ? '開始使用 🀄' : '下一步'}
                  </button>
                </div>
              </div>
            );
          })()}
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
    }
  </script>
</body>
</html>
