<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="麻將戰績">
  <meta name="theme-color" content="#FFF7ED">
  <title>麻將戰績追蹤器</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="storage.js"></script>
  <script src="libs/react.min.js"></script>
  <script src="libs/react-dom.min.js"></script>
  <script src="libs/babel.min.js"></script>
  <script src="libs/tailwind.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    input, textarea { -webkit-user-select: text; user-select: text; }
    /* safe area：viewport-fit=cover 讓 webview 佔滿整個螢幕，所有貼邊的間距都必須跟著
       機型的 inset 走。舊版全用寫死的 px：底部 pb-8(32px) 小於 home indicator 的 34pt，
       導覽列被壓住；頂部 pt-16(64px) 在 Dynamic Island 機型只剩 5px 餘裕，在 SE 又白白
       浪費 44px。用 !important 是因為 Tailwind runtime 產生的 utility 會注入在這段之後。 */
    .safe-top { padding-top: calc(env(safe-area-inset-top, 20px) + 20px) !important; }
    .safe-bottom-nav { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px) !important; }
    .safe-bottom-sheet { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px) !important; }
    .safe-page { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 96px) !important; }
    @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slide-up 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-in { animation: fadeIn 0.35s ease-out; }
    @keyframes pop { 0% { transform: scale(.82); opacity: 0; } 60% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
    .animate-pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.25) both; }

    /* ── 水墨印章視覺系統:米紙 / 墨 / 唯一的紅(勝+紅中印) ───────────────── */
    :root {
      --paper: #F4EEE1;   /* 米紙 — 底 */
      --ink: #201C18;     /* 墨 — 主文字 / hero */
      --ink2: #4A433C;    /* 次墨 — 輸(不用綠) */
      --red: #C0392B;     /* 全畫面唯一的紅 — 勝 + 紅中印 */
      --line: #D8CFBC;    /* 髮絲線 */
      --dim: #9A9284;
    }
    body { background: var(--paper); color: var(--ink);
      background-image: radial-gradient(rgba(32,28,24,.03) .5px, transparent .5px); background-size: 5px 5px; }
    .num, .font-black { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    /* 全域重映射:單色墨系,唯一的紅只給勝;輸=墨灰而非綠 */
    .text-red-500 { color: var(--red) !important; }
    .bg-red-50 { background: rgba(192,57,43,.09) !important; }
    .text-emerald-700, .text-emerald-600 { color: var(--ink2) !important; }
    .bg-emerald-50 { background: rgba(32,28,24,.06) !important; }
    .bg-emerald-500 { background: var(--ink2) !important; }   /* 輸的日曆點 → 墨灰,不用綠 */
    /* 藍色全部收進墨系(tab active/按鈕/今天/進度條) */
    .text-blue-600, .text-blue-500 { color: var(--ink) !important; }
    .bg-blue-600, .bg-blue-400 { background: var(--ink) !important; }
    .bg-blue-50\/50 { background: rgba(32,28,24,.05) !important; }
    .focus\:ring-blue-500:focus { --tw-ring-color: rgba(192,57,43,.4) !important; }
    .bg-slate-100, .bg-orange-50\/50 { background: var(--paper) !important; }
    .bg-slate-200\/80 { background: rgba(244,238,225,.82) !important; }
    /* 卡片=乾淨米白 + 髮絲邊,弱化陰影(極簡) */
    .bg-white { background: #FBF8F1 !important; }
    .bg-white\/80 { background: rgba(244,238,225,.82) !important; }
    .shadow-sm { box-shadow: 0 1px 3px rgba(32,28,24,.05) !important; }
    .border-orange-100, .border-slate-200, .border-slate-300, .border-gray-100, .border-gray-50, .border-gray-200 { border-color: var(--line) !important; }
    /* hero — 墨字,不用紅(紅留給印章) */
    .hero-num { font-size: 3.25rem; line-height: .92; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    /* 紅中印章 — 全畫面唯一的張力 */
    .seal { width: 54px; height: 54px; border: 2px solid var(--red); border-radius: 9px; color: var(--red);
      display: grid; place-items: center; font-size: 21px; font-weight: 900; transform: rotate(-6deg);
      line-height: 1; letter-spacing: -2px; box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px rgba(192,57,43,.15); }
    .seal.lose { border-color: var(--ink2); color: var(--ink2); box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px rgba(32,28,24,.1); }
  </style>
</head>
<body>
  <div id="root">
    <div style="max-width:420px;margin:0 auto;padding:96px 28px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#2B2621">
      <p style="font-size:17px;font-weight:800;margin:0 0 10px">麻將戰績無法載入</p>
      <p style="font-size:14px;line-height:1.7;color:#4A433C;margin:0 0 18px">
        程式沒有正常啟動。你的紀錄仍然保存在裝置上，沒有遺失。
      </p>
      <p style="font-size:14px;line-height:1.7;color:#4A433C;margin:0">
        請先完全關閉 App 再重新開啟。若重開後仍是這個畫面，
        <strong>請不要刪除 App</strong>（刪除會連同內部備份一起清除），
        直接來信 arlong6@gmail.com，我會協助你把資料救回來。
      </p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ─── 備份輸出（匯出與當機救援共用）──────────────────────────────────────
    const backupFileName = () => {
      const d = new Date();
      return `麻將戰績_${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`;
    };

    // 舊版用 <a download> 觸發下載。WKWebView 沒有 WKDownloadDelegate，a.download 是 no-op：
    // 使用者按「匯出備份」什麼都不會發生，而且整個函式沒有 try/catch 也沒有成功回饋，
    // 完全靜默。onboarding 第 4 頁卻正是在教使用者用這條路換手機。
    // 改成：原生環境寫進暫存檔後開系統分享（可存到「檔案」App 或傳給自己），
    // 非原生環境才退回瀏覽器下載。
    async function shareBackup(records, players) {
      // 摘要欄位放最前面，使用者打開檔案第一眼看到的是中文說明而不是英文欄位
      const summary = window.mahjongStore.backupSummary(records || []);
      const payload = JSON.stringify(
        { ...summary, version: 1, exportedAt: new Date().toISOString(), records: records || [], players: players || [] },
        null, 2
      );
      const fn = backupFileName();
      const Cap = window.Capacitor;
      const isNative = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
      const FS = Cap && Cap.Plugins && Cap.Plugins.Filesystem;
      const SH = Cap && Cap.Plugins && Cap.Plugins.Share;

      if (isNative && FS && SH) {
        try {
          const w = await FS.writeFile({ path: fn, data: payload, directory: 'CACHE', encoding: 'utf8' });
          await SH.share({ title: '麻將戰績備份', url: w.uri, dialogTitle: '儲存或傳送備份檔' });
          return { ok: true };
        } catch (e) {
          const m = (e && e.message) ? String(e.message) : String(e);
          if (/cancel/i.test(m)) return { ok: true, canceled: true };   // 使用者取消分享不是錯誤
          return { ok: false, error: m };
        }
      }

      try {
        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fn;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        return { ok: true };
      } catch (e) {
        return { ok: false, error: (e && e.message) ? e.message : String(e) };
      }
    }

    // ─── 救援畫面（載入失敗 / React 當機共用）──────────────────────────────
    const RescueScreen = ({ title, detail }) => {
      const [msg, setMsg] = useState('');
      const [busy, setBusy] = useState(false);
      const rescue = async () => {
        setBusy(true); setMsg('');
        try {
          const d = await window.mahjongStore.load();
          const r = await shareBackup(d.records, d.players);
          setMsg(r.ok
            ? (r.canceled ? '已取消。' : `已匯出 ${d.records.length} 筆紀錄。`)
            : '匯出失敗：' + r.error);
        } catch (e) {
          setMsg('讀取資料失敗：' + ((e && e.message) ? e.message : String(e)));
        } finally { setBusy(false); }
      };
      const S = {
        wrap: { minHeight: '100vh', background: '#F4EEE1', boxSizing: 'border-box',
                padding: 'calc(env(safe-area-inset-top, 0px) + 72px) 24px calc(env(safe-area-inset-bottom, 0px) + 48px)' },
        inner: { maxWidth: 400, margin: '0 auto' },
        h: { fontSize: 19, fontWeight: 800, color: '#201C18', margin: '0 0 12px' },
        p: { fontSize: 14.5, lineHeight: 1.75, color: '#4A433C', margin: '0 0 10px' },
        btn: { display: 'block', width: '100%', boxSizing: 'border-box', padding: '16px',
               borderRadius: 16, border: 'none', fontSize: 15, fontWeight: 800, cursor: 'pointer' },
      };
      return (
        <div style={S.wrap}>
          <div style={S.inner}>
            <p style={S.h}>{title}</p>
            <p style={S.p}>你的紀錄仍然保存在裝置上，沒有遺失。可以先把資料匯出保管，再試著重新開啟 App。</p>
            <p style={{ ...S.p, marginBottom: 28 }}><strong>請不要刪除 App</strong>——刪除會連同內部備份一起清除。</p>
            <button onClick={rescue} disabled={busy}
              style={{ ...S.btn, background: '#C0392B', color: '#fff', opacity: busy ? 0.6 : 1 }}>
              {busy ? '處理中…' : '匯出我的資料'}
            </button>
            <button onClick={() => window.location.reload()}
              style={{ ...S.btn, background: 'rgba(32,28,24,0.06)', color: '#201C18', marginTop: 12, padding: '14px' }}>
              重新載入
            </button>
            {msg && <p style={{ ...S.p, fontSize: 12.5, textAlign: 'center', marginTop: 16 }}>{msg}</p>}
            <p style={{ ...S.p, fontSize: 11.5, marginTop: 32, opacity: 0.8 }}>
              需要協助請來信 arlong6@gmail.com，附上這段訊息：<br />
              <span style={{ wordBreak: 'break-all' }}>{detail || '(無)'}</span>
            </p>
          </div>
        </div>
      );
    };

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { err: null }; }
      static getDerivedStateFromError(err) { return { err }; }
      componentDidCatch(err) { window.__mahjongLastError = err; }
      render() {
        if (!this.state.err) return this.props.children;
        const e = this.state.err;
        return <RescueScreen title="麻將戰績遇到問題" detail={(e && e.message) ? e.message : String(e)} />;
      }
    }

    // ─── Icons ────────────────────────────────────────────────────────────────
    const CalendarIcon = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <rect x="3" y="4" width="18" height="18" rx="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    );
    const PlusIcon = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    );
    const ChevronLeft = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    );
    const ChevronRight = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    );
    const XIcon = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    );
    const UsersIcon = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    );
    const BarChartIcon = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
        <line x1="2" y1="20" x2="22" y2="20"></line>
      </svg>
    );
    const EditIcon = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
    );
    const TrashIcon = () => (
      <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
        <path d="M10 11v6M14 11v6"></path>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
      </svg>
    );

    // ─── App ─────────────────────────────────────────────────────────────────
    // storage.load() 回報的 source 代表這份資料實際上是從哪一層撈回來的。
    // 這些狀態都意味著「主要儲存已經不可靠」，必須讓使用者知道並立刻匯出，
    // 而不是給他一個看起來很正常的畫面。
    const dataNoticeFor = (d) => {
      if (d.source === 'recovered') {
        let msg = d.persisted === false
          ? '已從備份還原你的紀錄，但無法寫回裝置儲存。請立刻到「牌友」頁面匯出備份。'
          : '偵測到主要儲存異常，已自動從備份還原你的紀錄。建議到「牌友」頁面匯出一份保存。';
        // 還原到的不是最完整的那份時必須說清楚，否則使用者會以為資料已經全回來了
        if (d.hasLargerBackup) {
          msg += `另有一份備份含 ${d.largestCount} 筆紀錄，可到「牌友」→「從自動備份還原」查看。`;
        }
        if (d.skippedRecords) {
          msg += `其中 ${d.skippedRecords} 筆資料已損毀，無法還原。`;
        }
        return msg;
      }
      if (d.source === 'legacy-fallback') {
        return '資料目前只存在舊版儲存區，搬移沒有完成。請到「牌友」頁面匯出備份，避免系統清理時遺失。';
      }
      if (d.source === 'empty' && d.suspicious) {
        return '偵測到備份檔存在但讀不出來。請先不要新增紀錄，到「牌友」頁面確認資料狀況。';
      }
      return null;
    };

    const App = () => {
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState(null);   // 載入失敗 → 顯示救援畫面
      const [saveState, setSaveState] = useState(null);    // 寫入失敗的細節 → 顯示常駐警告
      const [dataNotice, setDataNotice] = useState(null);  // 資料來源異常（救援/遷移回退）→ 顯示常駐提示
      const [amountError, setAmountError] = useState(''); // 金額驗證訊息（舊版是靜默 return）
      const [pendingRemovePlayer, setPendingRemovePlayer] = useState(null);
      const [records, setRecords] = useState([]);
      const [players, setPlayers] = useState(['阿明', '小華', '大強', '林小姐']);

      const [currentDate, setCurrentDate] = useState(new Date());
      const [activeTab, setActiveTab] = useState('calendar');

      // Modal & form state
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingRecord, setEditingRecord] = useState(null);
      const [selectedDate, setSelectedDate] = useState(new Date());
      const [amount, setAmount] = useState('');
      const [note, setNote] = useState('');
      const [type, setType] = useState('win');
      const [selectedPlayers, setSelectedPlayers] = useState([]);

      // Day detail sheet
      const [dayDetailDate, setDayDetailDate] = useState(null);
      const [pendingDeleteId, setPendingDeleteId] = useState(null);

      // Players tab
      const [newPlayerName, setNewPlayerName] = useState('');

      const importRef = useRef(null);
      const touchStartX = useRef(null);

      // Onboarding
      const [showOnboarding, setShowOnboarding] = useState(false);  // 由 storage.load() 的 onboarded 決定,見載入 effect
      const [onboardingStep, setOnboardingStep] = useState(0);

      const ONBOARDING_SLIDES = [
        { emoji: '🀄', title: '歡迎使用\n麻將戰績', desc: '記錄每一場的輸贏，清楚掌握自己的戰況與財務狀況。', accent: '#EA580C' },
        { emoji: '📅', title: '點擊日期\n新增紀錄', desc: '在日曆上點任意日期，輸入金額選擇贏錢或輸錢，即可新增一筆戰績。', accent: '#3B82F6' },
        { emoji: '👥', title: '管理你的\n牌友名單', desc: '建立常用牌友清單，每筆紀錄都可以標記這局的對戰成員。', accent: '#8B5CF6' },
        { emoji: '💾', title: '資料安全\n隨時備份', desc: '換手機前到「牌友」頁面匯出備份，新裝置上再匯入，所有紀錄完整保留。', accent: '#10B981' },
      ];

      const finishOnboarding = () => { setShowOnboarding(false); };  // 持久化由存檔 effect(onboarded: !showOnboarding)處理
      const nextOnboardingStep = () => {
        if (onboardingStep < ONBOARDING_SLIDES.length - 1) setOnboardingStep(s => s + 1);
        else finishOnboarding();
      };
      const handleOnboardingTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
      const handleOnboardingTouchEnd = (e) => {
        if (touchStartX.current === null) return;
        const diff = touchStartX.current - e.changedTouches[0].clientX;
        if (diff > 50) nextOnboardingStep();
        else if (diff < -50 && onboardingStep > 0) setOnboardingStep(s => s - 1);
        touchStartX.current = null;
      };

      useEffect(() => {
        (async () => {
          // 舊版沒有 try/catch 也沒有 finally。load() 一旦 reject（storage.js 內 legacyGet
          // 對 localStorage 的呼叫可能拋 SecurityError），setLoading(false) 永遠不會執行，
          // 使用者永久停在「載入中…」轉圈，連救援畫面都看不到。
          try {
            const d = await window.mahjongStore.load();
            setRecords(d.records); setPlayers(d.players);
            setShowOnboarding(!d.onboarded);   // 用持久化的 onboarded,localStorage 被清也不會重看引導
            // load() 的 source 是「這份資料從哪裡來」的診斷訊號。舊版整個丟掉，於是
            // 「主儲存已經壞了、現在跑的是備份還原的資料」——最該叫使用者立刻匯出的時刻——
            // UI 一聲不吭。
            setDataNotice(dataNoticeFor(d));
            setLastExportAt(d.lastExportAt || null);
          } catch (e) {
            setLoadError((e && e.message) ? e.message : String(e));
          } finally {
            setLoading(false);
          }
        })();
      }, []);

      // 存檔：載入完成後才寫，避免用初始空值覆蓋；debounce 備份
      useEffect(() => {
        // loadError 的守衛和 loading 一樣重要：load() 一旦失敗，catch 設 loadError、
        // finally 設 loading=false，這個 effect 就會立刻拿「從未被 load 覆寫的初始值 []」
        // 呼叫 save()，把儲存寫成空，1.5 秒後再把備份也蓋掉。
        // 畫面上 RescueScreen 正在跟使用者說「你的紀錄仍然保存在裝置上」，背景卻在刪。
        // 注意 line 596 的提早 return 不會阻止 effect 執行，不能當作保護。
        if (loading || loadError) return;
        let cancelled = false;
        // 舊版是 fire-and-forget：寫入失敗只會產生一個沒人接的 unhandled rejection，
        // UI 看起來存好了、磁碟其實沒寫進去。現在 save() 不再 reject，改看回傳值。
        window.mahjongStore.save({ records, players, onboarded: !showOnboarding })
          .then(r => { if (!cancelled) setSaveState(r && r.ok ? null : (r || { ok: false })); })
          .catch(() => { if (!cancelled) setSaveState({ ok: false }); });
        const t = setTimeout(() => window.mahjongStore.writeBackup({ records, players }), 1500);
        return () => { cancelled = true; clearTimeout(t); };
      }, [records, players, showOnboarding, loading]);

      // 上面那筆備份是 debounce 1500ms 的。App 在這段時間內被切到背景或被系統收掉，
      // 這輪備份就沒了。離開前補寫一次。
      const latestRef = useRef({ records, players });
      latestRef.current = { records, players };
      useEffect(() => {
        if (loading || loadError) return;   // 同上：載入失敗時這裡會再補一刀
        const flush = () => { try { window.mahjongStore.writeBackup(latestRef.current); } catch (_) {} };
        const onVis = () => { if (document.visibilityState === 'hidden') flush(); };
        window.addEventListener('pagehide', flush);
        document.addEventListener('visibilitychange', onVis);
        return () => {
          window.removeEventListener('pagehide', flush);
          document.removeEventListener('visibilitychange', onVis);
        };
      }, [loading]);

      // 金額錯誤訊息在使用者重新輸入時就該消失
      useEffect(() => { if (amountError) setAmountError(''); }, [amount]);

      // ─── Computed values ─────────────────────────────────────────────────
      const totalBalance = useMemo(() =>
        records.reduce((sum, r) => sum + (r.type === 'win' ? r.amount : -r.amount), 0), [records]);

      const monthlyBalance = useMemo(() => {
        const cm = currentDate.getMonth(), cy = currentDate.getFullYear();
        return records
          .filter(r => { const d = new Date(r.date); return d.getMonth() === cm && d.getFullYear() === cy; })
          .reduce((sum, r) => sum + (r.type === 'win' ? r.amount : -r.amount), 0);
      }, [records, currentDate]);

      const isWinningOverall = totalBalance >= 0;

      const statsData = useMemo(() => {
        const totalGames = records.length;
        const wins = records.filter(r => r.type === 'win').length;
        const losses = totalGames - wins;
        const winRate = totalGames > 0 ? Math.round((wins / totalGames) * 100) : 0;
        const totalWon = records.filter(r => r.type === 'win').reduce((s, r) => s + r.amount, 0);
        const totalLost = records.filter(r => r.type === 'loss').reduce((s, r) => s + r.amount, 0);

        // Last 6 months
        const monthlyData = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
          const m = d.getMonth(), y = d.getFullYear();
          const recs = records.filter(r => { const rd = new Date(r.date); return rd.getMonth() === m && rd.getFullYear() === y; });
          const balance = recs.reduce((s, r) => s + (r.type === 'win' ? r.amount : -r.amount), 0);
          monthlyData.push({ month: m + 1, balance, games: recs.length });
        }

        // Player stats
        const playerMap = {};
        records.forEach(r => {
          (r.participants || []).forEach(p => {
            if (!playerMap[p]) playerMap[p] = { games: 0, wins: 0 };
            playerMap[p].games++;
            if (r.type === 'win') playerMap[p].wins++;
          });
        });
        const playerStats = Object.entries(playerMap)
          .map(([name, d]) => ({ name, ...d }))
          .sort((a, b) => b.games - a.games);

        // Current streak
        let streak = 0, streakType = null;
        const sorted = [...records].sort((a, b) => new Date(b.date) - new Date(a.date));
        for (const r of sorted) {
          if (!streakType) { streakType = r.type; streak = 1; }
          else if (r.type === streakType) streak++;
          else break;
        }

        return { totalGames, wins, losses, winRate, totalWon, totalLost, monthlyData, playerStats, streak, streakType };
      }, [records]);

      // ─── Handlers ────────────────────────────────────────────────────────
      const resetForm = () => {
        setAmount(''); setNote(''); setSelectedPlayers([]); setType('win'); setEditingRecord(null);
      };

      const openAddModal = (date) => {
        setSelectedDate(date);
        setIsAddModalOpen(true);
      };

      const handleDateClick = (dateObj) => {
        const dateStr = dateObj.toDateString();
        const dayRecs = records.filter(r => new Date(r.date).toDateString() === dateStr);
        if (dayRecs.length > 0) {
          setPendingDeleteId(null);
          setDayDetailDate(dateObj);
        } else {
          openAddModal(dateObj);
        }
      };

      const handleEditRecord = (rec) => {
        // 在日詳情按過垃圾桶（two-tap 已武裝）再改點鉛筆進編輯，舊版沒有清掉 pendingDeleteId，
        // 編輯 Modal 的刪除鈕會直接是「再點一次確認刪除」狀態——一下就刪掉，保護等於失效。
        setPendingDeleteId(null);
        setEditingRecord(rec);
        setSelectedDate(new Date(rec.date));
        setAmount(String(rec.amount));
        setType(rec.type);
        setNote(rec.note || '');
        setSelectedPlayers(rec.participants || []);
        setDayDetailDate(null);
        setIsAddModalOpen(true);
      };

      const handleSaveRecord = () => {
        // 舊版：驗證不過直接 return，Modal 不關不動也不提示，看起來像當掉；
        // 且用 parseInt 會把 "12.5" 靜默截成 12、"1e5" 截成 1。
        const parsed = Number(String(amount).trim());
        if (!String(amount).trim() || !Number.isFinite(parsed) || parsed <= 0) {
          setAmountError('請輸入大於 0 的金額');
          return;
        }
        if (editingRecord) {
          setRecords(prev => prev.map(r => r.id === editingRecord.id
            ? { ...r, amount: parsed, type, note, participants: selectedPlayers }
            : r
          ));
        } else {
          setRecords(prev => [...prev, {
            id: window.mahjongStore.newId(), date: selectedDate.toISOString(),
            amount: parsed, type, note, participants: selectedPlayers
          }]);
        }
        resetForm();
        setIsAddModalOpen(false);
      };

      const handleDeleteRecord = (id) => {
        // Close day detail if this was the last record for that day
        if (dayDetailDate) {
          const remaining = records.filter(r => r.id !== id && new Date(r.date).toDateString() === dayDetailDate.toDateString());
          if (remaining.length === 0) setDayDetailDate(null);
        }
        setRecords(prev => prev.filter(r => r.id !== id));
        setPendingDeleteId(null);
        if (isAddModalOpen) { setIsAddModalOpen(false); resetForm(); }
      };

      // Two-tap delete pattern: first tap arms, second tap fires
      const handleTwoTapDelete = (id, e) => {
        e && e.stopPropagation();
        if (pendingDeleteId === id) {
          handleDeleteRecord(id);
        } else {
          setPendingDeleteId(id);
          setTimeout(() => setPendingDeleteId(prev => prev === id ? null : prev), 3000);
        }
      };

      // 舊版一個 X 就直接移除、零確認。改成與刪紀錄一致的 two-tap。
      // 注意：只從名單移除，已寫入紀錄的 participants 不動——那是歷史事實，不該被追溯修改。
      const removePlayer = (name) => {
        if (pendingRemovePlayer !== name) {
          setPendingRemovePlayer(name);
          setTimeout(() => setPendingRemovePlayer(prev => prev === name ? null : prev), 3000);
          return;
        }
        setPlayers(prev => prev.filter(pl => pl !== name));
        setPendingRemovePlayer(null);
      };

      const togglePlayerSelection = (name) =>
        setSelectedPlayers(prev => prev.includes(name) ? prev.filter(p => p !== name) : [...prev, name]);

      const addNewPlayer = () => {
        const name = newPlayerName.trim();
        if (name && !players.includes(name)) { setPlayers(prev => [...prev, name]); setNewPlayerName(''); }
      };

      const [exportMsg, setExportMsg] = useState('');
      const [restoreList, setRestoreList] = useState(null);   // null = 未開啟
      const [restoreMsg, setRestoreMsg] = useState('');
      const [lastExportAt, setLastExportAt] = useState(null);
      const exportData = async () => {
        setExportMsg('');
        const r = await shareBackup(records, players);
        if (!r.ok) { setExportMsg('匯出失敗：' + r.error); return; }
        if (r.canceled) return;
        setExportMsg(`已匯出 ${records.length} 筆紀錄。`);
        // 手動匯出是唯一能讓資料離開這支手機的一層，記下時間讓使用者看得到自己多久沒備份
        try {
          const m = await window.mahjongStore.markExported();
          setLastExportAt(m.at);
        } catch (_) {}
      };

      const formatLastExport = (iso) => {
        if (!iso) return '還沒有匯出過。匯出的備份檔不會隨 App 一起被刪掉。';
        const d = new Date(iso);
        if (!Number.isFinite(d.getTime())) return '還沒有匯出過。';
        const days = Math.floor((Date.now() - d.getTime()) / 86400000);
        const when = `${d.getMonth() + 1}/${d.getDate()}`;
        if (days <= 0) return `上次匯出：${when}（今天）`;
        if (days === 1) return `上次匯出：${when}（昨天）`;
        return `上次匯出：${when}（${days} 天前）`;
      };

      // 自動救援只在主儲存整個讀不出來時才會跑。誤刪的情況主儲存是好的，
      // 所以備份需要一個使用者自己拿得到的出口。
      const openRestore = async () => {
        setRestoreMsg('');
        try {
          setRestoreList(await window.mahjongStore.listBackups());
        } catch (_) {
          setRestoreList([]);
        }
      };

      const BACKUP_KIND_LABEL = {
        latest: '最新自動備份', daily: '每日快照',
        safety: '大量刪除前的保險檔', 'pre-migration': '舊版搬移前',
      };

      const formatBackupTime = (iso) => {
        if (!iso) return '時間不明';
        const d = new Date(iso);
        if (!Number.isFinite(d.getTime())) return '時間不明';
        const p2 = (n) => String(n).padStart(2, '0');
        return `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
      };

      const doRestore = async (b) => {
        const r = await window.mahjongStore.readBackup(b.name);
        if (!r.ok) { setRestoreMsg(r.error); return; }
        if (!window.confirm(`還原這份 ${r.records.length} 筆的備份？目前的 ${records.length} 筆會被取代。`)) return;
        // 取代前先把現況留成保險檔，選錯備份也能再換一份回來。
        // snapshot() 永不 reject，失敗只會回 ok:false——忽略它等於在沒有退路的情況下覆蓋資料。
        let snap = { ok: false, skipped: 'unknown' };
        try { snap = await window.mahjongStore.snapshot({ records, players }); } catch (_) {}
        if (!snap.ok && snap.skipped !== 'duplicate') {
          if (!window.confirm('無法建立還原點，萬一選錯這份備份就換不回來了。仍要繼續嗎？')) return;
        }
        setRecords(r.records);
        if (r.players.length) setPlayers(r.players);
        setRestoreList(null);
        setRestoreMsg(`已還原 ${r.records.length} 筆紀錄。`);
      };

      const importData = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          let parsed;
          try {
            parsed = JSON.parse(ev.target.result);
          } catch {
            window.alert('檔案格式錯誤，請選擇正確的備份檔案。');
            return;
          }
          // 舊版只擋 JSON.parse。任何合法 JSON（{}、別的 app 的備份、amount 是字串）
          // 都會直接進 state：輕則總結算靜默算錯，重則 render 期拋錯白屏且已持久化。
          const v = window.mahjongStore.validateBackup(parsed);
          if (!v.ok) { window.alert('無法匯入：' + v.error); return; }
          if (window.confirm(`匯入 ${v.records.length} 筆紀錄？目前的 ${records.length} 筆資料將被覆蓋。`)) {
            // 匯入和還原一樣是整批取代，同樣要先留退路。舊版完全沒有——選到上個月的舊備份
            // 覆蓋掉現在的資料，而且落差不到一半時連大幅刪除防護都不會觸發。
            (async () => {
              let snap = { ok: false, skipped: 'unknown' };
              try { snap = await window.mahjongStore.snapshot({ records, players }); } catch (_) {}
              if (!snap.ok && snap.skipped !== 'duplicate') {
                if (!window.confirm('無法建立還原點，萬一匯入的不是你要的那份就換不回來了。仍要繼續嗎？')) return;
              }
              setRecords(v.records);
              if (v.players.length) setPlayers(v.players);
            })();
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      // ─── Calendar helpers ─────────────────────────────────────────────────
      const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
      const firstDayOfMonth = (y, m) => new Date(y, m, 1).getDay();

      const renderCalendar = () => {
        const days = [];
        const year = currentDate.getFullYear(), month = currentDate.getMonth();
        const totalDays = daysInMonth(year, month), firstDay = firstDayOfMonth(year, month);
        for (let i = 0; i < firstDay; i++) days.push(<div key={`e-${i}`} className="h-14" />);
        for (let d = 1; d <= totalDays; d++) {
          const dateObj = new Date(year, month, d);
          const dayRecs = records.filter(r => new Date(r.date).toDateString() === dateObj.toDateString());
          const isToday = new Date().toDateString() === dateObj.toDateString();
          const hasWin = dayRecs.some(r => r.type === 'win');
          const hasLoss = dayRecs.some(r => r.type === 'loss');
          days.push(
            <div key={d} onClick={() => handleDateClick(dateObj)}
              className={`h-14 border-t border-black/5 flex flex-col items-center justify-start pt-1 cursor-pointer active:bg-gray-100 transition-all ${isToday ? 'bg-blue-50/50' : ''}`}>
              <span className={`text-xs ${isToday ? 'text-blue-600 font-black underline decoration-2' : 'text-gray-600'}`}>{d}</span>
              {dayRecs.length > 0 && (
                <div className="flex flex-col items-center mt-0.5 gap-0.5">
                  <div className="flex gap-0.5">
                    {hasWin && <div className="w-1.5 h-1.5 rounded-full bg-red-500" />}
                    {hasLoss && <div className="w-1.5 h-1.5 rounded-full bg-emerald-500" />}
                  </div>
                  {dayRecs.length > 1 && <span className="text-[8px] font-black text-gray-400">{dayRecs.length}</span>}
                </div>
              )}
            </div>
          );
        }
        return days;
      };

      const isCurrentYear = currentDate.getFullYear() === new Date().getFullYear();
      const calendarTitle = isCurrentYear
        ? `${currentDate.getMonth() + 1}月`
        : `${currentDate.getFullYear()} / ${currentDate.getMonth() + 1}`;

      const dayDetailRecords = dayDetailDate
        ? records.filter(r => new Date(r.date).toDateString() === dayDetailDate.toDateString())
        : [];

      const maxAbsBalance = Math.max(...statsData.monthlyData.map(m => Math.abs(m.balance)), 1);

      if (loadError) return <RescueScreen title="無法讀取你的戰績" detail={loadError} />;
      if (loading) return (<div className="flex items-center justify-center h-screen text-gray-400">載入中…</div>);

      // ─── Render ──────────────────────────────────────────────────────────
      return (
        <div className={`min-h-screen transition-colors duration-700 safe-page ${isWinningOverall ? 'bg-orange-50/50' : 'bg-slate-100'}`}>

          {/* 警告列與 header 舊版各自 sticky top-0，一捲動就疊在同一個位置：banner 的 z-30 比較高，
              會整個蓋掉標題與總結算，看起來像壞掉。改成同一個 sticky 容器依序排列。 */}
          <div className={`sticky top-0 z-30 safe-top border-b transition-all duration-500 ${isWinningOverall ? 'bg-white/80 border-orange-100 backdrop-blur-md' : 'bg-slate-200/80 border-slate-300 backdrop-blur-md'}`}>

            {/* 存檔失敗警告：這是使用者唯一會知道「剛才那筆可能沒存進去」的管道。
                儲存層沒回應、以及連緊急備份都沒寫成，這兩種情況比單純寫入失敗更嚴重，要講得更重。 */}
            {saveState && (
              <div className="px-5 py-3 mb-2" style={{ background: 'var(--red)' }}>
                <p className="text-[12px] font-black text-white leading-relaxed">
                  {saveState.timedOut
                    ? '儲存沒有回應，最近的變更可能沒有寫入。請立刻到「牌友」頁面匯出備份，並且先不要關閉 App。'
                    : saveState.backupOk === false
                      ? '儲存失敗，緊急備份也沒有成功。你的資料目前只存在畫面上，請立刻到「牌友」頁面匯出備份，不要關閉 App。'
                      : '儲存失敗，最近的變更可能沒有寫入。請立刻到「牌友」頁面匯出備份，並避免刪除 App。'}
                </p>
              </div>
            )}

            {/* 資料來源異常：從備份救回、遷移沒完成、或備份檔讀不出來 */}
            {dataNotice && (
              <div className="px-5 py-3 mb-2" style={{ background: 'var(--ink)' }}>
                <p className="text-[12px] font-black text-white leading-relaxed">{dataNotice}</p>
              </div>
            )}

            <header className="px-6 pb-5">
            <div className="flex items-center justify-between mb-6">
              <h1 className="text-xl font-black tracking-[0.08em]" style={{ color: 'var(--ink)' }}>麻將戰績</h1>
              <span className="text-[11px] font-bold text-gray-500 tracking-[0.1em]">
                {isWinningOverall ? '紅不讓 · 氣勢正旺' : '閉關中 · 韜光養晦'}
              </span>
            </div>
            <div className="flex items-end justify-between">
              <div>
                <span className="text-[10px] text-gray-400 font-black tracking-[0.35em]">總結算</span>
                <div className="hero-num mt-1" style={{ color: 'var(--ink)' }}>
                  {totalBalance >= 0 ? '+' : '−'}{Math.abs(totalBalance).toLocaleString()}
                  <span className="text-base font-black text-gray-400 ml-1">元</span>
                </div>
              </div>
              <div className={`seal ${isWinningOverall ? '' : 'lose'}`}>{isWinningOverall ? '紅中' : '白板'}</div>
            </div>
          </header>
          </div>

          <main className="max-w-md mx-auto p-4 space-y-5">

            {/* ── Calendar Tab ──────────────────────────────────────── */}
            {activeTab === 'calendar' && (
              <div className="animate-in space-y-5">
                {/* Month nav */}
                <div className={`p-4 rounded-3xl shadow-sm border flex justify-between items-center bg-white ${isWinningOverall ? 'border-orange-100' : 'border-slate-200'}`}>
                  <div className="flex items-center gap-3">
                    <div className={`p-2 rounded-2xl ${monthlyBalance >= 0 ? 'bg-red-50 text-red-500' : 'bg-emerald-50 text-emerald-600'}`}>
                      <div className="w-5 h-5"><CalendarIcon /></div>
                    </div>
                    <div>
                      <div className="text-[10px] text-gray-400 font-bold">本月合計</div>
                      <div className="font-black text-base">{monthlyBalance >= 0 ? '+' : ''}{monthlyBalance.toLocaleString()}</div>
                    </div>
                  </div>
                  <div className="flex gap-1 items-center bg-gray-50 rounded-2xl p-1">
                    <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1))} className="p-1.5 active:bg-white rounded-xl transition-all">
                      <div className="w-4 h-4 text-gray-400"><ChevronLeft /></div>
                    </button>
                    <div className="px-1 font-black text-xs text-gray-600 w-20 text-center">{calendarTitle}</div>
                    <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1))} className="p-1.5 active:bg-white rounded-xl transition-all">
                      <div className="w-4 h-4 text-gray-400"><ChevronRight /></div>
                    </button>
                  </div>
                </div>

                {/* Calendar grid */}
                <div className="bg-white rounded-[32px] shadow-sm overflow-hidden border border-gray-100">
                  <div className="grid grid-cols-7 text-center py-3 bg-gray-50/50">
                    {['日','一','二','三','四','五','六'].map(d => (
                      <span key={d} className="text-[10px] font-black text-gray-300">{d}</span>
                    ))}
                  </div>
                  <div className="grid grid-cols-7">{renderCalendar()}</div>
                </div>

                {/* Recent records list */}
                <div className="space-y-2.5">
                  <div className="flex justify-between items-center px-2">
                    <h3 className="font-black text-sm text-gray-800">最近紀錄</h3>
                    <span className="text-[10px] text-gray-400 font-bold">共 {records.length} 筆</span>
                  </div>
                  {records.length === 0 ? (
                    <div className="bg-white/40 rounded-3xl py-12 text-center border border-dashed border-gray-200">
                      <p className="text-4xl mb-2">🀄</p>
                      <p className="text-xs text-gray-400">點擊日期新增第一筆戰績</p>
                    </div>
                  ) : (
                    <div style={{ maxHeight: '420px', overflowY: 'auto' }} className="space-y-2.5">

                  </p>
                </div>
                <div className="w-full max-w-sm flex flex-col items-center gap-6">
                  <div className="flex gap-2">
                    {ONBOARDING_SLIDES.map((_, i) => (
                      <div key={i} onClick={() => setOnboardingStep(i)}
                        className="rounded-full transition-all duration-300 cursor-pointer"
                        style={{ width: i === onboardingStep ? '24px' : '8px', height: '8px', background: i === onboardingStep ? slide.accent : '#333' }} />
                    ))}
                  </div>
                  <button onClick={nextOnboardingStep}
                    className="w-full py-4 rounded-2xl font-black text-base text-white active:scale-95 transition-all"
                    style={{ background: slide.accent }}>
                    {isLast ? '開始使用 🀄' : '下一步'}
                  </button>
                </div>
              </div>
            );
          })()}
        </div>
      );
    };

    // React 之外拋出的錯誤（事件處理器、非同步）不會被 ErrorBoundary 接到。
    // 至少記下來，讓使用者回報時能附上。
    window.addEventListener('error', e => { window.__mahjongLastError = e.error || e.message; });
    window.addEventListener('unhandledrejection', e => { window.__mahjongLastError = e.reason; });

    ReactDOM.render(
      <ErrorBoundary><App /></ErrorBoundary>,
      document.getElementById('root')
    );
  </script>

  <script>
    // sw.js 是 cache-first 且 CACHE_NAME 固定，命中就永遠回舊檔。在 Capacitor 的
    // capacitor://localhost 自訂 scheme 下 WKWebView 不支援 Service Worker，註冊本來就會
    // 失敗並被 catch 吞掉——但與其依賴那個假設，不如直接不註冊，徹底排除
    // 「App 被舊 bundle 鎖住、更新推不出去」的風險。網頁版不受影響。
    if ('serviceWorker' in navigator && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
    }
  </script>
</body>
</html>
